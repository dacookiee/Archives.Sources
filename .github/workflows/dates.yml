name: Update upload dates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dates.json
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, datetime
          log = subprocess.run(['git', '-c', 'core.quotePath=false', 'log', '--reverse', '-M', '--name-status', '--format=@%cI'],
                               capture_output=True, text=True, check=True).stdout
          dates, when = {}, None
          for line in log.splitlines():
              if line.startswith('@'):
                  when = int(datetime.datetime.fromisoformat(line[1:]).timestamp() * 1000); continue
              parts = line.split('\t')
              if len(parts) < 2: continue
              st = parts[0]
              if st == 'A': dates[parts[1]] = when
              elif st.startswith('R') and len(parts) == 3: dates[parts[2]] = dates.pop(parts[1], when)
              elif st == 'D': dates.pop(parts[1], None)
          dates.pop('dates.json', None)
          with open('dates.json', 'w') as f: json.dump(dates, f, ensure_ascii=False, indent=0, sort_keys=True)
          PYEOF

      - name: Save dates.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add dates.json
          git diff --cached --quiet || (git commit -m "Update upload dates" && git push)
